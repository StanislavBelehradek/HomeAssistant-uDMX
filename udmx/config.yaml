name: "USB DMX512 (Lixada/uDMX)"
version: "0.1.1"
slug: "udmx"
description: "Control DMX512 lighting fixtures through a uDMX-compatible USB adapter (e.g. Lixada USB DMX512) via MQTT discovery."
url: "https://github.com/StanislavBelehradek/HomeAssistant-uDMX"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
usb: true
services:
  - "mqtt:want"
options:
  vendor_id: "16C0"
  product_id: "05DC"
  refresh_rate: 30
  chunk_size: 8
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  discovery_prefix: "homeassistant"
  lights: []
schema:
  vendor_id: "str"
  product_id: "str"
  refresh_rate: "int(0,44)"
  chunk_size: "int(0,64)"
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  discovery_prefix: "str"
  lights:
    - name: "str"
      mode: "list(single|cct|rgb|rgbcct)"
      start_channel: "int(1,512)"
